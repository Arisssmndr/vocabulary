            accentOrange: '#ff9900'

    ::-webkit-scrollbar-thumb:hover { background: #555; }

</head>
<body class="bg-darkBg text-white min-h-screen flex flex-col">

  <nav class="flex justify-between items-center px-6 py-5 max-w-7xl mx-auto w-full border-b border-borderDark">

    <div>

  <div class="h-3 w-full bg-gradient-to-r from-blue-500 via-accentOrange to-green-500"></div>

  <header class="text-center py-24 px-4 flex-col items-center justify-center relative overflow-hidden">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-900/10 blur-[100px] rounded-full pointer-events-none"></div>
    <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold mb-6 tracking-tight relative z-10">
      Network System <br class="hidden md:block">
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500">Vocabulary</span>
    </h1>
    <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto mb-10 relative z-10">
      Learn essential network system terms, devices, technologies, and communication concepts quickly and clearly.
    </p>
    <div class="max-w-xl mx-auto relative z-10">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">

        </div>
        <input type="text" id="searchInput" class="block w-full p-4 pl-12 text-sm text-white bg-cardBg border border-borderDark rounded-full focus:ring-accentOrange focus:border-accentOrange placeholder-gray-500 transition-all outline-none" placeholder="Search English words or translations...">
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto px-4 pb-24 w-full">
    <div class="flex justify-between items-end mb-8 border-b border-borderDark pb-4">
      <h2 class="text-2xl font-semibold">Word List</h2>
      <span id="wordCount" class="text-gray-500 text-sm">Loading...</span>
    </div>

    <div id="wordGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-6 2xl:grid-cols-8 gap-4"></div>

    <div id="noResults" class="hidden flex-col items-center justify-center py-20 text-center">
      <svg class="w-16 h-16 text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <h3 class="text-xl font-medium text-gray-300">No words found</h3>
      <p class="text-gray-500 mt-2">Try another keyword.</p>
    </div>

    <div class="mt-8 text-center">
      <button id="loadMoreBtn" class="hidden bg-borderDark hover:bg-gray-700 text-white text-sm font-medium py-2 px-5 rounded-md transition-all border border-gray-600 hover:border-gray-400">
        Load More
      </button>
    </div>
  </main>

  <footer class="border-t border-borderDark py-8 text-center text-gray-500 text-sm mt-auto">
    <p>© 2026 KamusKu. Inspired by modern partner-directory design.</p>
  </footer>

      { en: "man", id: "man" },

      { en: "wan", id: "wan" },
      { en: "wireless local area network", id: "jaringan area lokal nirkabel" },
      { en: "wlan", id: "wlan" },
      { en: "gaming", id: "game" },
      { en: "stable transfer", id: "transfer stabil" },
      { en: "fast connection", id: "koneksi cepat" },
      { en: "high transfer rate", id: "laju transfer tinggi" },

      { en: "log out", id: "keluar" },
      { en: "authentication", id: "autentikasi" },
      { en: "authorization", id: "otorisasi" },
      { en: "encryption", id: "enkripsi" },
      { en: "decryption", id: "dekripsi" },
      { en: "backup", id: "cadangan" },
      { en: "storage", id: "penyimpanan" },
      { en: "cloud", id: "awan" },
      { en: "internet", id: "internet" },
      { en: "intranet", id: "intranet" },
      { en: "extranet", id: "ekstranet" },
      { en: "remote", id: "jarak jauh" },
      { en: "access", id: "akses" },
      { en: "administrator", id: "administrator" },
      { en: "configuration", id: "konfigurasi" },
      { en: "installation", id: "instalasi" },
      { en: "maintenance", id: "pemeliharaan" },
      { en: "upgrade", id: "meningkatkan" },
      { en: "monitor", id: "memantau" },
      { en: "diagnostic", id: "diagnostik" },
      { en: "performance", id: "kinerja" },
      { en: "stable", id: "stabil" },
      { en: "secure", id: "aman" },
      { en: "reliable", id: "andal" },
      { en: "efficient", id: "efisien" },
      { en: "mobile device", id: "perangkat seluler" },
      { en: "smart home", id: "rumah pintar" },
      { en: "smart sensor", id: "sensor pintar" },
      { en: "printer", id: "printer" },
      { en: "keyboard", id: "papan ketik" },
      { en: "mouse", id: "tetikus" },
      { en: "speaker", id: "speaker" },
      { en: "headphone", id: "headphone" },
      { en: "bluetooth earphones", id: "earphone bluetooth" },
      { en: "smartphone", id: "ponsel pintar" },
      { en: "tablet", id: "tablet" },
      { en: "lore", id: "istilah" }
    ];

    vocabularyData.sort((a, b) => a.en.localeCompare(b.en));

    const wordGrid = document.getElementById('wordGrid');
    const searchInput = document.getElementById('searchInput');
    const noResults = document.getElementById('noResults');
    const wordCount = document.getElementById('wordCount');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    const pageSize = 48;
    let filteredData = [...vocabularyData];
    let visibleCount = pageSize;
    let voices = [];

    function loadVoices() {
      voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakWord(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.95;
      utterance.pitch = 1;
      const preferred = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
      if (preferred) utterance.voice = preferred;
      window.speechSynthesis.speak(utterance);
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'bg-cardBg border border-borderDark rounded-xl p-5 hover:border-gray-500 hover:bg-[#222] transition-all duration-300 group cursor-pointer flex flex-col justify-between h-full';
      card.innerHTML = `
        <div>
          <div class="flex justify-between items-start mb-2 gap-3">
            <h3 class="text-xl font-bold text-white group-hover:text-accentOrange transition-colors break-words">${item.en}</h3>
            <button type="button" class="shrink-0 p-1 rounded-md text-gray-600 hover:text-gray-300 transition-colors" aria-label="Speak ${item.en}" title="Speak">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
              </svg>
            </button>
          </div>
          <p class="text-gray-400 font-medium">${item.id}</p>
        </div>`;
      card.querySelector('button').addEventListener('click', (e) => {
        e.stopPropagation();
        speakWord(item.en);
      });
      card.addEventListener('click', () => speakWord(item.en));
      return card;
    }

    function renderCards() {
      wordGrid.innerHTML = '';
      const data = filteredData.slice(0, visibleCount);

      if (filteredData.length === 0) {
        wordGrid.classList.add('hidden');
        noResults.classList.remove('hidden');
        noResults.classList.add('flex');
      } else {
        wordGrid.classList.remove('hidden');
        noResults.classList.add('hidden');
        noResults.classList.remove('flex');
        const frag = document.createDocumentFragment();
        data.forEach(item => frag.appendChild(createCard(item)));
        wordGrid.appendChild(frag);
      }

      wordCount.textContent = `Showing ${Math.min(visibleCount, filteredData.length)} of ${filteredData.length} words`;
      loadMoreBtn.classList.toggle('hidden', visibleCount >= filteredData.length || filteredData.length === 0);
    }

    searchInput.addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase().trim();
      filteredData = vocabularyData.filter(item =>
        item.en.toLowerCase().includes(searchTerm) ||
        item.id.toLowerCase().includes(searchTerm)
      );
      visibleCount = pageSize;
      renderCards();
    });

    loadMoreBtn.addEventListener('click', () => {
      visibleCount += pageSize;
      renderCards();
    });

    renderCards();
  </script>
</body>
</html>
